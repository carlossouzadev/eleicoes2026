<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urnas do Exterior · Eleições 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131b26;
      --card-hover: #1c2738;
      --ink: #f0f4f8;
      --mut: #8b9bb0;
      --line: #202d40;
      --accent: #2563eb;
      --c0: #3b82f6;
      --c1: #22c55e;
      --c2: #eab308;
      --c3: #a855f7;
      --c4: #ec4899;
      --c5: #06b6d4;
      --c6: #f97316;
      --c7: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 'Plus Jakarta Sans', system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(19, 27, 38, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
    }

    .nav-wrap {
      width: 98%;
      max-width: 2800px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    h1 {
      font: 700 24px/1.2 'Space Grotesk', sans-serif;
      margin: 0;
      color: var(--ink);
    }

    .sub {
      color: var(--mut);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-live {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(1.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    main {
      width: 98%;
      max-width: 2800px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }

    .stat-card:hover {
      border-color: #3b82f650;
      transform: translateY(-2px);
    }

    .stat-label {
      color: var(--mut);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--ink);
    }

    .stat-sub {
      font-size: 12px;
      color: var(--mut);
      margin-top: 4px;
    }

    .winners-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .winner-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }

    .winner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .winner-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }

    .winner-count {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      padding: 2px 12px;
      border-radius: 8px;
    }

    .winner-count.lula {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .winner-count.flavio {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .country-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .country-tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .country-tag span {
      color: var(--mut);
      font-size: 11px;
    }

    .dash-layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 24px;
    }

    @media (max-width: 1400px) {
      .dash-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .bar {
      display: flex;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--line);
      padding: 3px;
    }

    .bar i {
      display: block;
      min-width: 2px;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .legend-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .legend-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .legend-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-pct {
      font-size: 20px;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }

    .legend-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .legend-votes {
      font-size: 13px;
      color: var(--mut);
    }

    .badge-diff-up {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .badge-diff-down {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .badge-same {
      color: var(--mut);
      font-size: 11px;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 480px;
    }

    input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f172a;
      color: var(--ink);
      font: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mut);
      pointer-events: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px 14px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      font-weight: 600;
      color: var(--mut);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    th:hover {
      color: var(--ink);
    }

    td.b {
      width: 35%;
      min-width: 220px;
    }

    tr.country {
      cursor: pointer;
      transition: background 0.15s;
    }

    tr.country:hover td {
      background: var(--card-hover);
    }

    tr.post td {
      color: var(--mut);
      font-size: 13px;
      background: rgba(15, 23, 42, 0.4);
    }

    tr.post td:first-child {
      padding-left: 36px;
    }

    .bar.s {
      height: 14px;
      padding: 1px;
    }

    .wrap {
      overflow-x: auto;
    }

    .badge-ok {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .badge-wait {
      background: rgba(234, 179, 8, 0.15);
      color: #fde047;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .hist-sub {
      font-size: 11px;
      color: var(--mut);
      display: block;
      margin-top: 2px;
    }

    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
      max-height: 800px;
      overflow-y: auto;
    }

    .feed-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .feed-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .feed-time {
      color: var(--mut);
      font-size: 11px;
    }

    .feed-sub {
      color: var(--mut);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>

  <header>
    <div class="nav-wrap">
      <div class="logo">
        <span class="logo-badge">UF ZZ</span>
        <div>
          <h1>Urnas do Exterior · Eleições 2026</h1>
          <div class="sub" id="sub"><span class="dot-live"></span> Carregando dados...</div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid-stats" id="stats"></div>

    <div class="winners-grid" id="winners"></div>

    <div class="dash-layout">
      <div class="dash-main">
        <section class="card">
          <h2 style="margin: 0 0 16px 0; font-size: 18px; font-family: 'Space Grotesk', sans-serif;">Resultado Geral do
            Exterior</h2>
          <div id="overall">Carregando votação...</div>
        </section>

        <section class="card">
          <div class="tools">
            <h2 style="margin: 0; font-size: 18px; font-family: 'Space Grotesk', sans-serif;">Apuração por País e Posto
              Consular</h2>
            <div class="search-box">
              <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input id="q" type="search" placeholder="Buscar país ou consulado (ex: Lisboa, Miami...)"
                aria-label="Buscar país ou posto">
            </div>
          </div>
          <div class="wrap">
            <table id="t"></table>
          </div>
        </section>
      </div>

      <aside class="dash-side">
        <section class="card">
          <h2 style="margin: 0 0 4px 0; font-size: 18px; font-family: 'Space Grotesk', sans-serif;">Últimas Atualizações
          </h2>
          <div style="color: var(--mut); font-size: 12px;">Postos consulares atualizados recentemente</div>
          <div class="feed-list" id="feed">
            <div style="color:var(--mut);">Buscando atualizações...</div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const fmt = (n) => (n ?? 0).toLocaleString('pt-BR');
    const pct = (v, t) => (t ? (v / t) * 100 : 0);
    const pf = (x) => (x || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
    const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)', 'var(--c7)'];

    let D = null, H = [], order = [], sortKey = 'votos', sortDir = -1, open = new Set();

    const total = (votes) => Object.values(votes || {}).reduce((a, b) => a + b, 0);
    const color = (n) => COLORS[Math.min(order.indexOf(n), COLORS.length - 1)] || 'var(--c7)';
    const nameOf = (n) => {
      if (D && D.candidates && Array.isArray(D.candidates)) {
        const found = D.candidates.find((c) => c.n === n);
        if (found && found.name) return found.name;
      }
      return 'Candidato ' + n;
    };

    const stack = (votes, cls) => {
      const t = total(votes);
      const extraClass = cls ? cls : '';
      if (!t) return '<div class="bar ' + extraClass + '"></div>';
      const bars = order.map((n) => {
        const w = pct(votes[n] || 0, t);
        const bg = color(n);
        const title = nameOf(n) + ': ' + pf(w);
        return '<i style="width:' + w + '%;background:' + bg + '" title="' + title + '"></i>';
      }).join('');
      return '<div class="bar ' + extraClass + '">' + bars + '</div>';
    };

    const candPct = (votes, candNum) => { const t = total(votes); return pf(pct(votes[candNum] || 0, t)); };

    function getHistCompareForCandidate(v2026, v2022, cand2026, cand2022) {
      const t26 = total(v2026);
      const t22 = total(v2022);
      if (!t26 || !t22) return '<span class="hist-sub">2022: sem dados</span>';

      const p26 = pct((v2026 && v2026[cand2026]) || 0, t26);
      const p22 = pct((v2022 && v2022[cand2022]) || 0, t22);
      const diff = p26 - p22;
      const sign = diff >= 0 ? '+' : '';

      return '<span class="hist-sub">2022: ' + pf(p22) + ' (' + sign + diff.toFixed(1) + ' pp)</span>';
    }

    function getDiffLastCollect() {
      if (!H || !Array.isArray(H) || H.length < 2 || !D || !D.overall || !D.overall.votes) return {};
      try {
        const past = H[H.length - 2];
        if (!past || !past.votes) return {};

        const diffs = {};
        const tNow = total(D.overall.votes);
        const tPast = total(past.votes);

        for (const n of order) {
          const vNow = (D.overall.votes && D.overall.votes[n]) || 0;
          const vPast = (past.votes && past.votes[n]) || 0;

          const newVotes = vNow - vPast;
          const pNow = pct(vNow, tNow);
          const pPast = pct(vPast, tPast);
          const ppDiff = pNow - pPast;

          diffs[n] = { newVotes, ppDiff };
        }
        return diffs;
      } catch (e) {
        return {};
      }
    }

    function renderStats() {
      if (!D || !D.overall) return;
      const o = D.overall;
      const totalVotos = total(o.votes);
      const total2022 = total(o.votes2022);
      const pctPostos = pct(o.postosComDados || 0, o.postos || 186);
      const totalSec = o.totalBallots || o.urnas || 1200;
      const pctSecoes = pct(o.secoesCounted || 0, totalSec);

      $('#stats').innerHTML =
        '<div class="stat-card">' +
        '<div class="stat-label">Votos Válidos 2026</div>' +
        '<div class="stat-val">' + fmt(totalVotos) + '</div>' +
        '<div class="stat-sub">vs ' + fmt(total2022) + ' votos em 2022</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-label">Seções com BU Publicado</div>' +
        '<div class="stat-val">' + fmt(o.secoesCounted || 0) + ' <span style="font-size:16px;color:var(--mut)">/ ' + fmt(totalSec) + '</span></div>' +
        '<div class="stat-sub">' + pf(pctSecoes) + ' das urnas apuradas</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-label">Postos Consulares</div>' +
        '<div class="stat-val">' + (o.postosComDados || 0) + ' <span style="font-size:16px;color:var(--mut)">/ ' + (o.postos || 186) + '</span></div>' +
        '<div class="stat-sub">' + pf(pctPostos) + ' dos postos com dados</div>' +
        '</div>' +
        '<div class="stat-card">' +
        '<div class="stat-label">Brancos &amp; Nulos</div>' +
        '<div class="stat-val">' + fmt((o.brancos || 0) + (o.nulos || 0)) + '</div>' +
        '<div class="stat-sub">' + fmt(o.brancos || 0) + ' brancos · ' + fmt(o.nulos || 0) + ' nulos</div>' +
        '</div>';
    }

    function renderWinners() {
      if (!D || !D.countries || !Array.isArray(D.countries) || order.length < 2) return;

      // Identifica dinamicamente os números dos dois principais candidatos com base na ordem geral
      const candLula = order[0];   // 1º colocado geral (Lula)
      const candFlavio = order[1]; // 2º colocado geral (Flávio Bolsonaro)

      const lulaCountries = [];
      const flavioCountries = [];

      for (const c of D.countries) {
        const t = total(c.votes);
        if (!t) continue;
        const votesLula = (c.votes && c.votes[candLula]) || 0;
        const votesFlavio = (c.votes && c.votes[candFlavio]) || 0;

        if (votesLula > votesFlavio) {
          lulaCountries.push({ country: c.country, pct: pct(votesLula, t) });
        } else if (votesFlavio > votesLula) {
          flavioCountries.push({ country: c.country, pct: pct(votesFlavio, t) });
        }
      }

      lulaCountries.sort((a, b) => b.pct - a.pct);
      flavioCountries.sort((a, b) => b.pct - a.pct);

      const nameLula = nameOf(candLula);
      const nameFlavio = nameOf(candFlavio);

      const renderTags = (list) => list.map(item =>
        '<div class="country-tag">' + item.country + ' <span>(' + pf(item.pct) + ')</span></div>'
      ).join('');

      $('#winners').innerHTML =
        '<div class="winner-card">' +
        '<div class="winner-header">' +
        '<div class="winner-title"><span class="dot" style="background:' + color(candLula) + '"></span> Liderança: ' + nameLula + '</div>' +
        '<div class="winner-count lula">' + lulaCountries.length + ' países</div>' +
        '</div>' +
        '<div class="country-tags">' + (lulaCountries.length ? renderTags(lulaCountries) : '<span style="color:var(--mut);">Nenhum país apurado</span>') + '</div>' +
        '</div>' +
        '<div class="winner-card">' +
        '<div class="winner-header">' +
        '<div class="winner-title"><span class="dot" style="background:' + color(candFlavio) + '"></span> Liderança: ' + nameFlavio + '</div>' +
        '<div class="winner-count flavio">' + flavioCountries.length + ' países</div>' +
        '</div>' +
        '<div class="country-tags">' + (flavioCountries.length ? renderTags(flavioCountries) : '<span style="color:var(--mut);">Nenhum país apurado</span>') + '</div>' +
        '</div>';
    }

    function renderOverall() {
      if (!D || !D.overall || !D.overall.votes) return;
      const o = D.overall, t26 = total(o.votes);
      const diffs = getDiffLastCollect();

      const items = order.map((n) => {
        const v26 = (o.votes && o.votes[n]) || 0;
        const p26 = pct(v26, t26);
        const d = diffs[n];

        let diffBadge = '<span class="badge-same">sem novos votos</span>';

        if (d && (d.newVotes > 0 || Math.abs(d.ppDiff) >= 0.001)) {
          const signV = d.newVotes >= 0 ? '+' : '';
          const signPP = d.ppDiff >= 0 ? '+' : '';
          const badgeCls = d.ppDiff >= 0 ? 'badge-diff-up' : 'badge-diff-down';
          diffBadge = '<span class="' + badgeCls + '">' + signV + fmt(d.newVotes) + ' votos (' + signPP + d.ppDiff.toFixed(2) + ' pp na coleta)</span>';
        }

        return '<div class="legend-item">' +
          '<div class="legend-head">' +
          '<span class="legend-name"><span class="dot" style="background:' + color(n) + '"></span>' + nameOf(n) + '</span>' +
          '<span class="legend-pct">' + pf(p26) + '</span>' +
          '</div>' +
          '<div class="legend-foot">' +
          '<span class="legend-votes">' + fmt(v26) + ' votos</span>' +
          diffBadge +
          '</div>' +
          '</div>';
      }).join('');

      $('#overall').innerHTML = stack(o.votes) + '<div class="legend">' + items + '</div>';
    }

    function renderFeed() {
      if (!D) return;

      let posts = Array.isArray(D.posts) ? D.posts.filter(p => p && p.secoesCounted > 0) : [];

      if (posts.length === 0) {
        $('#feed').innerHTML = '<div style="color:var(--mut);font-size:13px;">Sem atualizações recentes nos postos.</div>';
        return;
      }

      posts.sort((a, b) => (b.lastUpdatedAt || b.updatedAt || 0) - (a.lastUpdatedAt || a.updatedAt || 0));

      $('#feed').innerHTML = posts.slice(0, 20).map(p => {
        const ts = p.lastUpdatedAt || p.updatedAt || 0;
        const timeStr = ts > 0 ? new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Apurado';
        const pVotes = total(p.votes);

        return '<div class="feed-item">' +
          '<div class="feed-head">' +
          '<span>' + (p.name || '') + ' <span style="color:var(--mut);font-size:12px;">(' + (p.country || '') + ')</span></span>' +
          '<span class="feed-time">' + timeStr + '</span>' +
          '</div>' +
          '<div class="feed-sub">' +
          '<span>' + (p.secoesCounted || 0) + ' de ' + (p.secoes || p.urnas || 1) + ' urnas</span>' +
          '<strong>' + fmt(pVotes) + ' votos</strong>' +
          '</div>' +
          '</div>';
      }).join('');
    }

    function renderTable() {
      if (!D || !D.countries || !Array.isArray(D.countries)) return;
      const q = ($('#q').value || '').trim().toLowerCase();
      const postsList = Array.isArray(D.posts) ? D.posts : [];

      const rows = D.countries.map((c) => ({
        ...c,
        votos: total(c.votes),
        votos2022: total(c.votes2022),
        lead: pct((c.votes && c.votes[order[0]]) || 0, total(c.votes))
      })).filter((c) => !q || (c.country && c.country.toLowerCase().includes(q)) || postsList.some((p) => p && p.country === c.country && p.name && p.name.toLowerCase().includes(q)));

      const key = { pais: 'country', votos: 'votos', urnas: 'urnas', lead: 'lead' }[sortKey] || 'votos';
      rows.sort((a, b) => (typeof a[key] === 'string' ? (a[key] || '').localeCompare(b[key] || '', 'pt') : (a[key] || 0) - (b[key] || 0)) * sortDir);

      const th = (k, l) => '<th data-k="' + k + '">' + l + (sortKey === k ? (sortDir < 0 ? ' ↓' : ' ↑') : '') + '</th>';
      let h = '<tr>' +
        th('pais', 'País') +
        th('urnas', 'Urnas') +
        th('votos', 'Votos 2026') +
        '<th>Distribuição</th>' +
        '<th>LULA (2026 vs 2022)</th>' +
        '<th>FLÁVIO BOLSONARO (2026 vs 2022)</th>' +
        '</tr>';

      for (const c of rows) {
        const isExpanded = open.has(c.country);

        const vLula = (c.votes && c.votes['13']) || 0;
        const vFlavio = (c.votes && c.votes['22']) || 0;

        const histLula = getHistCompareForCandidate(c.votes, c.votes2022, '13', '13');
        const histFlavio = getHistCompareForCandidate(c.votes, c.votes2022, '22', '22');

        h += '<tr class="country" data-c="' + c.country + '">' +
          '<td>' + (isExpanded ? '▾' : '▸') + ' <strong>' + c.country + '</strong></td>' +
          '<td>' + fmt(c.urnas) + '</td>' +
          '<td>' + fmt(c.votos) + '<span class="hist-sub">vs ' + fmt(c.votos2022) + ' (2022)</span></td>' +
          '<td class="b">' + stack(c.votes, 's') + '</td>' +
          '<td><strong>' + fmt(vLula) + ' votos</strong> (' + candPct(c.votes, '13') + ')' + histLula + '</td>' +
          '<td><strong>' + fmt(vFlavio) + ' votos</strong> (' + candPct(c.votes, '22') + ')' + histFlavio + '</td>' +
          '</tr>';

        if (isExpanded) {
          for (const p of postsList.filter((p) => p && p.country === c.country)) {
            const pTotal = total(p.votes);
            const pTotal22 = total(p.votes2022);
            const statusBadge = p.status === 'ok' ? '<span class="badge-ok">Apurado</span>' : '<span class="badge-wait">Aguardando</span>';

            const pLula = (p.votes && p.votes['13']) || 0;
            const pFlavio = (p.votes && p.votes['22']) || 0;

            const pHistLula = getHistCompareForCandidate(p.votes, p.votes2022, '13', '13');
            const pHistFlavio = getHistCompareForCandidate(p.votes, p.votes2022, '22', '22');

            h += '<tr class="post">' +
              '<td>' + (p.name || '') + ' ' + statusBadge + '</td>' +
              '<td>' + fmt(p.urnas) + '</td>' +
              '<td>' + fmt(pTotal) + '<span class="hist-sub">vs ' + fmt(pTotal22) + ' (22)</span></td>' +
              '<td class="b">' + stack(p.votes, 's') + '</td>' +
              '<td>' + fmt(pLula) + ' votos (' + candPct(p.votes, '13') + ')' + pHistLula + '</td>' +
              '<td>' + fmt(pFlavio) + ' votos (' + candPct(p.votes, '22') + ')' + pHistFlavio + '</td>' +
              '</tr>';
          }
        }
      }
      $('#t').innerHTML = h;
    }

    function tickSub() {
      if (!D || !D.updatedAt) return;
      const next = new Date(D.updatedAt).getTime() + 5 * 60e3 - Date.now();
      const s = Math.max(0, Math.round(next / 1000));
      const timeStr = new Date(D.updatedAt).toLocaleTimeString('pt-BR');
      const totalSec = (D.overall && (D.overall.totalBallots || D.overall.urnas)) || 1200;
      const pctSec = ((D.overall.secoesCounted || 0) / totalSec * 100).toFixed(1);
      $('#sub').innerHTML = '<span class="dot-live"></span> Atualizado às ' + timeStr + ' · ' + pctSec + '% das seções apuradas · Próxima coleta em ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    async function load() {
      try {
        const r = await fetch('data/latest.json?ts=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        if (D && d.updatedAt === D.updatedAt) return;
        D = d;
        order = Object.entries((D.overall && D.overall.votes) || {}).sort((a, b) => b[1] - a[1]).map(([n]) => n);
        renderStats();
        renderWinners();
        renderOverall();
        renderFeed();
        renderTable();
        tickSub();
      } catch (e) {
        $('#sub').textContent = 'Sem dados de apuração disponíveis no momento.';
      }

      fetch('data/history.json?ts=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : [])
        .then(data => { H = Array.isArray(data) ? data : []; if (D) { renderWinners(); renderOverall(); } })
        .catch(() => { });
    }

    $('#q').addEventListener('input', () => D && renderTable());
    $('#t').addEventListener('click', (e) => {
      const th = e.target.closest('th[data-k]'), tr = e.target.closest('tr.country');
      if (th) {
        sortDir = sortKey === th.dataset.k ? -sortDir : (th.dataset.k === 'pais' ? 1 : -1);
        sortKey = th.dataset.k;
      } else if (tr) {
        open.has(tr.dataset.c) ? open.delete(tr.dataset.c) : open.add(tr.dataset.c);
      }
      renderTable();
    });

    load();
    setInterval(load, 30e3);
    setInterval(tickSub, 1000);
  </script>
</body>

</html>
